# Nginx site config cho CareerCompass.
# Đặt tại: /etc/nginx/sites-available/careercompass
# Thay YOUR_DOMAIN bằng domain thật trước khi dùng.
#
# Lưu ý: chạy `certbot --nginx -d YOUR_DOMAIN` SAU khi file này hoạt động ở port 80.
# Certbot sẽ tự thêm block listen 443 + chứng chỉ + redirect 80->443 vào file này.

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    # Upload bảng điểm: app cho phép tới 10MB (spring.servlet.multipart.max-file-size)
    # nên nginx phải nới rộng hơn, mặc định của nginx chỉ 1MB.
    client_max_body_size 12M;

    location / {
        proxy_pass http://127.0.0.1:8080;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # X-Forwarded-Proto để Spring biết request gốc là https
        # (đi kèm SERVER_FORWARD_HEADERS_STRATEGY=framework trong docker-compose).
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Mentor AI gọi Gemini có thể lâu; nới timeout để không đứt giữa chừng.
        proxy_connect_timeout 60s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }
}

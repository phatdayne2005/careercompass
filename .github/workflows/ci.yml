name: CareerCompass CI

on:
  push:
    branches: ["main", "master", "dev", "develop"]
  pull_request:
    branches: ["main", "master", "dev", "develop"]

jobs:
  verify:
    name: Verify Spring Boot app
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: careercompass
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -proot"
          --health-interval=10s
          --health-timeout=10s
          --health-retries=10

    env:
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/careercompass?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      GOOGLE_CLIENT_ID: mock-client-id
      GOOGLE_CLIENT_SECRET: mock-client-secret
      GEMINI_API_KEY: mock-gemini-key
      MAIL_USERNAME: mock@example.com
      MAIL_PASSWORD: mock-password
      ADMIN_EMAIL: admin@gmail.com
      ADMIN_PASSWORD: 123456
      STUDENT_EMAIL: student@gmail.com
      STUDENT_PASSWORD: 123456
      COUNSELOR_EMAIL: counselor@gmail.com
      COUNSELOR_PASSWORD: 123456

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Verify with Maven
        run: ./mvnw -B clean verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload application JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: careercompass-jar
          path: target/*.jar
          retention-days: 7

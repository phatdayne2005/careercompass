spring:
  application:
    name: CareerCompass

  # Kéo file application-local.yml (gitignored) chứa secret thật vào lúc chạy.
  # "optional:" => thiếu file vẫn boot được (teammate chưa có secret vẫn chạy local login).
  config:
    import: optional:file:application-local.yml

  # ====== DATABASE ======
  # Credentials lấy từ env var (DB_USERNAME, DB_PASSWORD).
  # Default cho dev local: root / 123456. Khi deploy prod set env var thật.
  datasource:
    url: jdbc:mysql://localhost:3306/careercompass?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ====== JPA / HIBERNATE ======
  jpa:
    hibernate:
      ddl-auto: update           # dev: tự tạo/cập nhật bảng từ @Entity. Prod KHÔNG dùng.
    show-sql: true               # in SQL ra console (để học + debug)
    open-in-view: false          # tắt OSIV để tránh N+1 query ngầm khi render view
    properties:
      hibernate:
        format_sql: true         # format SQL cho đẹp

  # ====== THYMELEAF ======
  thymeleaf:
    cache: false                 # dev: sửa HTML không cần restart

  # ====== OAUTH2 CLIENT (Google Login) ======
  # Giá trị thật của client-id/secret nằm ở application-local.yml (gitignored).
  # Google là provider "well-known" của Spring Security nên không cần khai báo endpoint.
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email

# ====== SERVER ======
server:
  port: 8080

# ====== LOG ======
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE   # in cả tham số bind vào câu SQL

# ====== SEED ADMIN ======
app:
  admin:
    email: ${ADMIN_EMAIL:admin@gmail.com}
    password: ${ADMIN_PASSWORD:123456}
  student:
    email: ${STUDENT_EMAIL:student@gmail.com}
    password: ${STUDENT_PASSWORD:123456}
  counselor:
    email: ${COUNSELOR_EMAIL:counselor@gmail.com}
    password: ${COUNSELOR_PASSWORD:123456}

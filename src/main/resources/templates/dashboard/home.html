<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Dashboard · CareerCompass')}"></head>
<body class="min-h-screen bg-[#0f172a] font-sans text-[#d7deea] antialiased">

<div th:replace="~{layout/base :: appNav(${activeNav})}"></div>

<main class="px-6 py-8 lg:px-[52px]">
    <h1 class="text-[34px] font-extrabold tracking-[-0.03em] text-[#e6ebf5] sm:text-[40px]">
        Dashboard
    </h1>
    <p class="mt-2 text-[18px] font-medium text-[#7f8ba0]">FR2.4 tiến độ · FR6.2 hoạt động gần đây</p>

    <section class="mt-8 grid grid-cols-1 gap-6 md:grid-cols-3">
        <!-- Thẻ tiến độ roadmap -->
        <div class="rounded-2xl border border-[#334155] bg-[#1e293b] p-6">
            <p class="text-sm font-semibold text-[#7f8ba0]">Tiến độ Roadmap</p>
            <p class="mt-2 text-[32px] font-extrabold text-[#e6ebf5]"
               th:text="${dashboard.roadmapCompletionPercent} + '%'">0%</p>
            <p class="mt-1 text-sm text-[#7f8ba0]"
               th:text="${dashboard.completedNodes} + '/' + ${dashboard.totalNodes} + ' node hoàn thành'">0/0</p>
        </div>

        <!-- Thẻ kỹ năng -->
        <div class="rounded-2xl border border-[#334155] bg-[#1e293b] p-6">
            <p class="text-sm font-semibold text-[#7f8ba0]">Kỹ năng đã đạt</p>
            <p class="mt-2 text-[32px] font-extrabold text-[#22c55e]"
               th:text="${dashboard.matchedSkillCount}">0</p>
            <p class="mt-1 text-sm text-[#7f8ba0]"
               th:text="${dashboard.missingSkillCount} + ' kỹ năng còn thiếu'">0</p>
        </div>

        <!-- Thẻ liên kết Market Pulse -->
        <a th:href="@{/market/pulse}"
           class="rounded-2xl border border-[#334155] bg-[#1e293b] p-6 transition hover:border-[#8b5cf6]">
            <p class="text-sm font-semibold text-[#7f8ba0]">Market Pulse</p>
            <p class="mt-2 text-[18px] font-bold text-[#a78bfa]">Xem xu hướng tuyển dụng →</p>
        </a>
    </section>

    <!-- Hoạt động gần đây -->
    <section class="mt-8 rounded-2xl border border-[#334155] bg-[#1e293b] p-6">
        <h2 class="mb-4 text-[20px] font-bold text-[#e6ebf5]">Hoạt động gần đây</h2>
        <ul class="flex flex-col gap-3">
            <li th:each="activity : ${dashboard.recentActivities}"
                class="flex items-center justify-between border-b border-[#334155] pb-3 text-sm last:border-0">
                <span th:text="${activity.description}">Đăng ký tài khoản</span>
                <span class="text-[#7f8ba0]" th:text="${#temporals.format(activity.createdAt, 'dd/MM/yyyy HH:mm')}">01/01/2026</span>
            </li>
            <li th:if="${dashboard.recentActivities.isEmpty()}" class="text-[#7f8ba0]">Chưa có hoạt động nào.</li>
        </ul>
    </section>
</main>
</body>
</html>

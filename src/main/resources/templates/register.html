<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Đăng ký · CareerCompass')}"></head>
<body class="min-h-screen bg-[#030712] font-sans text-slate-200 antialiased flex items-center justify-center p-4 sm:p-6 relative overflow-x-hidden cyber-grid">

<!-- Background Aurora Glow Orbs -->
<div class="fixed top-1/4 right-1/4 w-[450px] h-[450px] aurora-orb-violet blur-[130px] pointer-events-none"></div>
<div class="fixed bottom-1/4 left-1/4 w-[450px] h-[450px] aurora-orb-cyan blur-[130px] pointer-events-none"></div>

<main class="w-full max-w-md relative z-10">
    <div class="cyber-card rounded-3xl p-8 sm:p-10 border border-white/[0.1] shadow-2xl relative overflow-hidden">

        <!-- Radiant Top Accent Line -->
        <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-violet-500 via-fuchsia-500 to-cyan-400"></div>

        <!-- Brand Header -->
        <div class="flex justify-center mb-6">
            <div th:replace="~{layout/base :: brand}"></div>
        </div>

        <div class="text-center mb-7">
            <h1 class="text-2xl sm:text-3xl font-black text-white tracking-tight">Tạo tài khoản</h1>
            <p class="mt-1.5 text-xs sm:text-sm text-slate-400">Khởi tạo hồ sơ học tập và định hướng AI cá nhân hóa</p>
        </div>

        <!-- Register Form -->
        <form th:action="@{/register}" th:object="${registerForm}" method="post" class="space-y-4">

            <div>
                <label for="fullName" class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1.5">Họ và tên</label>
                <input type="text" id="fullName" th:field="*{fullName}"
                       placeholder="Nguyễn Văn A"
                       class="w-full rounded-2xl border border-white/[0.08] bg-[#070b16] px-4 py-3 text-xs sm:text-sm text-slate-100 placeholder-slate-600 focus:border-cyan-400 focus:outline-none focus:ring-2 focus:ring-cyan-400/20 transition">
                <p th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"
                   class="mt-1.5 text-xs text-rose-400 font-medium"></p>
            </div>

            <div>
                <label for="email" class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1.5">Email</label>
                <input type="email" id="email" th:field="*{email}"
                       placeholder="sinhvien@university.edu.vn"
                       class="w-full rounded-2xl border border-white/[0.08] bg-[#070b16] px-4 py-3 text-xs sm:text-sm text-slate-100 placeholder-slate-600 focus:border-cyan-400 focus:outline-none focus:ring-2 focus:ring-cyan-400/20 transition">
                <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}"
                   class="mt-1.5 text-xs text-rose-400 font-medium"></p>
            </div>

            <div>
                <label for="password" class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1.5">Mật khẩu</label>
                <input type="password" id="password" th:field="*{password}"
                       placeholder="Tối thiểu 6 ký tự"
                       class="w-full rounded-2xl border border-white/[0.08] bg-[#070b16] px-4 py-3 text-xs sm:text-sm text-slate-100 placeholder-slate-600 focus:border-cyan-400 focus:outline-none focus:ring-2 focus:ring-cyan-400/20 transition">
                <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}"
                   class="mt-1.5 text-xs text-rose-400 font-medium"></p>
            </div>

            <button type="submit"
                    class="w-full mt-3 rounded-2xl bg-gradient-to-r from-violet-600 via-indigo-500 to-cyan-500 py-3 text-xs sm:text-sm font-extrabold text-white shadow-lg shadow-violet-500/25 transition-all duration-200 hover:opacity-95 hover:shadow-violet-500/40 cursor-pointer">
                Tạo tài khoản ngay
            </button>
        </form>

        <!-- Divider -->
        <div class="my-6 flex items-center gap-3">
            <span class="h-px flex-1 bg-white/[0.08]"></span>
            <span class="text-[10px] font-bold uppercase tracking-wider text-slate-500">Hoặc</span>
            <span class="h-px flex-1 bg-white/[0.08]"></span>
        </div>

        <!-- Google OAuth2 Button -->
        <a th:href="@{/oauth2/authorization/google}"
           class="flex w-full items-center justify-center gap-3 rounded-2xl border border-white/[0.08] bg-[#070b16] hover:bg-[#0e1628] hover:border-cyan-500/30 py-2.5 text-xs sm:text-sm font-bold text-slate-200 transition duration-200">
            <svg class="h-4 w-4 shrink-0" viewBox="0 0 48 48" aria-hidden="true">
                <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 4.1 29.6 2 24 2 11.8 2 2 11.8 2 24s9.8 22 22 22 22-9.8 22-22c0-1.5-.2-2.7-.4-3.5z"/>
                <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 16 19 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 4.1 29.6 2 24 2 16.3 2 9.7 6.3 6.3 14.7z"/>
                <path fill="#4CAF50" d="M24 46c5.5 0 10.5-2.1 14.3-5.6l-6.6-5.6C29.5 36.6 26.9 37.5 24 37.5c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.6 41.6 16.2 46 24 46z"/>
                <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.2 5.7l6.6 5.6C41.4 36.9 44 31 44 24c0-1.5-.2-2.7-.4-3.5z"/>
            </svg>
            <span>Đăng ký với Google</span>
        </a>

        <!-- Footer -->
        <p class="mt-7 text-center text-xs text-slate-400">
            Đã có tài khoản?
            <a th:href="@{/login}" class="font-bold text-cyan-400 hover:text-cyan-300 transition">Đăng nhập ngay →</a>
        </p>
    </div>
</main>

</body>
</html>

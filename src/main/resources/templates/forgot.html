<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Quên mật khẩu · CareerCompass')}"></head>
<body class="min-h-screen bg-[#090d16] font-sans text-slate-200 antialiased flex items-center justify-center p-4 sm:p-6 relative overflow-x-hidden">

<!-- Decorative Background Glow -->
<div class="fixed -top-40 -left-40 w-96 h-96 bg-indigo-600/15 rounded-full blur-3xl pointer-events-none"></div>
<div class="fixed -bottom-40 -right-40 w-96 h-96 bg-purple-600/15 rounded-full blur-3xl pointer-events-none"></div>

<main class="w-full max-w-md relative z-10">
    <div class="glass-card rounded-3xl p-8 sm:p-10 border border-white/[0.08] shadow-2xl shadow-black/60">

        <!-- Brand Header -->
        <div class="flex justify-center mb-6">
            <div th:replace="~{layout/base :: brand}"></div>
        </div>

        <div class="text-center mb-7">
            <h1 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">Khôi phục mật khẩu</h1>
            <p class="mt-1.5 text-sm text-slate-400">Nhập email đăng ký để nhận link đặt lại mật khẩu</p>
        </div>

        <!-- Feedback Alert -->
        <div th:if="${param.sent}"
             class="mb-5 rounded-2xl border border-emerald-500/30 bg-emerald-500/10 px-4 py-3 text-xs sm:text-sm text-emerald-300 flex items-center gap-2">
            <svg class="w-4 h-4 shrink-0 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
            <span>Đã gửi hướng dẫn! Hãy kiểm tra hộp thư của bạn (kể cả hòm thư Spam).</span>
        </div>

        <!-- Forgot Password Form -->
        <form th:action="@{/forgot}" method="post" class="space-y-4">
            <div>
                <label for="email" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Email tài khoản</label>
                <input type="email" id="email" name="email" required
                       placeholder="sinhvien@university.edu.vn"
                       class="w-full rounded-xl border border-white/[0.08] bg-[#0c1220] px-4 py-3 text-sm text-slate-100 placeholder-slate-500 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/30 transition">
            </div>

            <button type="submit"
                    class="w-full mt-2 rounded-xl bg-gradient-to-r from-indigo-600 via-indigo-500 to-purple-600 py-3 text-sm font-bold text-white shadow-lg shadow-indigo-600/25 transition-all duration-200 hover:opacity-95 hover:shadow-indigo-600/40 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 cursor-pointer">
                Gửi liên kết đặt lại
            </button>
        </form>

        <p class="mt-7 text-center text-xs sm:text-sm text-slate-400">
            <a th:href="@{/login}" class="font-semibold text-indigo-400 hover:text-indigo-300 transition">← Quay lại trang đăng nhập</a>
        </p>
    </div>
</main>

</body>
</html>

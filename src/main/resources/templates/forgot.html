<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Quên mật khẩu · CareerCompass')}"></head>
<body class="min-h-screen bg-[#0F172A] font-sans text-slate-200 antialiased flex items-center justify-center px-4">

<main class="w-full max-w-md">
    <div class="rounded-2xl border border-[#232c40] bg-[#141b2d] p-8 shadow-2xl shadow-black/40">

        <!-- Brand (biến tấu icon chìa khoá cho ngữ cảnh khôi phục) -->
        <div class="flex items-center gap-2">
            <span>🔑</span>
            <span class="text-base font-bold text-white tracking-tight">CareerCompass</span>
        </div>

        <!-- Tiêu đề -->
        <h1 class="mt-5 text-2xl font-bold text-white">Đặt lại mật khẩu</h1>
        <p class="mt-1 text-sm text-slate-400">Nhập email đã đăng ký — chúng tôi sẽ gửi link đặt lại mật khẩu.</p>

        <!-- Form gửi yêu cầu. th:action => tự chèn CSRF token. -->
        <form th:action="@{/forgot}" method="post" class="mt-6 space-y-4">
            <div>
                <label for="email" class="block text-sm font-medium text-slate-300">Email</label>
                <input type="email" id="email" name="email" required
                       placeholder="you@university.edu"
                       class="mt-1.5 w-full rounded-lg border border-[#2a3346] bg-[#0d1322] px-3 py-2.5 text-sm text-slate-100 placeholder-slate-500 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/50">
            </div>

            <button type="submit"
                    class="w-full rounded-lg bg-blue-600 py-2.5 text-sm font-semibold text-white transition hover:bg-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/60">
                Gửi link đặt lại
            </button>
        </form>

        <!-- Thông báo trung lập sau khi gửi (không tiết lộ email có tồn tại hay không) -->
        <div th:if="${param.sent}"
             class="mt-4 rounded-lg border border-emerald-500/30 bg-emerald-500/10 px-3 py-2.5 text-sm text-emerald-300">
            ✓ Đã gửi! Kiểm tra hộp thư của bạn (kể cả Spam).
        </div>

        <p class="mt-6 text-center text-sm">
            <a th:href="@{/login}" class="font-medium text-blue-400 hover:text-blue-300">← Quay lại đăng nhập</a>
        </p>
    </div>
</main>

</body>
</html>

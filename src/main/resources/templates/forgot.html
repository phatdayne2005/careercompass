<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Quên mật khẩu · CareerCompass')}"></head>
<body class="min-h-screen bg-[#030712] font-sans text-slate-200 antialiased flex items-center justify-center p-4 sm:p-6 relative overflow-x-hidden cyber-grid">

<!-- Background Aurora Glow Orbs -->
<div class="fixed top-1/4 left-1/4 w-[450px] h-[450px] aurora-orb-cyan blur-[130px] pointer-events-none"></div>
<div class="fixed bottom-1/4 right-1/4 w-[450px] h-[450px] aurora-orb-violet blur-[130px] pointer-events-none"></div>

<main class="w-full max-w-md relative z-10">
    <div class="cyber-card rounded-3xl p-8 sm:p-10 border border-white/[0.1] shadow-2xl relative overflow-hidden">

        <!-- Radiant Top Accent Line -->
        <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-cyan-400 via-violet-500 to-fuchsia-500"></div>

        <!-- Brand Header -->
        <div class="flex justify-center mb-6">
            <div th:replace="~{layout/base :: brand}"></div>
        </div>

        <div class="text-center mb-7">
            <h1 class="text-2xl sm:text-3xl font-black text-white tracking-tight">Khôi phục mật khẩu</h1>
            <p class="mt-1.5 text-xs sm:text-sm text-slate-400">Nhập email đăng ký để nhận mã liên kết đặt lại mật khẩu</p>
        </div>

        <!-- Feedback Alert -->
        <div th:if="${param.sent}"
             class="mb-5 rounded-2xl border border-emerald-500/30 bg-emerald-500/10 px-4 py-3 text-xs sm:text-sm text-emerald-300 flex items-center gap-2">
            <svg class="w-4 h-4 shrink-0 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
            <span>Đã gửi hướng dẫn! Hãy kiểm tra hộp thư của bạn (kể cả thư mục Spam).</span>
        </div>

        <!-- Forgot Password Form -->
        <form th:action="@{/forgot}" method="post" class="space-y-4">
            <div>
                <label for="email" class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1.5">Email tài khoản</label>
                <input type="email" id="email" name="email" required
                       placeholder="sinhvien@university.edu.vn"
                       class="w-full rounded-2xl border border-white/[0.08] bg-[#070b16] px-4 py-3 text-xs sm:text-sm text-slate-100 placeholder-slate-600 focus:border-cyan-400 focus:outline-none focus:ring-2 focus:ring-cyan-400/20 transition">
            </div>

            <button type="submit"
                    class="w-full mt-3 rounded-2xl bg-gradient-to-r from-cyan-500 via-indigo-500 to-violet-600 py-3 text-xs sm:text-sm font-extrabold text-white shadow-lg shadow-cyan-500/25 transition-all duration-200 hover:opacity-95 hover:shadow-cyan-500/40 cursor-pointer">
                Gửi liên kết đặt lại
            </button>
        </form>

        <p class="mt-7 text-center text-xs text-slate-400">
            <a th:href="@{/login}" class="font-bold text-cyan-400 hover:text-cyan-300 transition">← Quay lại trang đăng nhập</a>
        </p>
    </div>
</main>

</body>
</html>

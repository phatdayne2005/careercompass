<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Trang chủ · CareerCompass')}"></head>
<body class="min-h-screen bg-[#0a0f1c] font-sans text-slate-200 antialiased flex items-center justify-center px-4">

<main class="w-full max-w-lg text-center">
    <div class="rounded-2xl border border-[#232c40] bg-[#141b2d] p-10 shadow-2xl shadow-black/40">

        <div class="flex justify-center">
            <div th:replace="~{layout/base :: brand}"></div>
        </div>

        <h1 class="mt-6 text-2xl font-bold text-white">
            Xin chào, <span class="text-violet-400" th:text="${email}">bạn</span> 👋
        </h1>
        <p class="mt-2 text-sm text-slate-400">
            Bạn đã đăng nhập thành công vào CareerCompass.
        </p>
        <p class="mt-1 text-xs text-slate-500">
            (Trang tạm — Dashboard thật sẽ do gói P5 dựng tại đây.)
        </p>

        <!-- Logout: POST + th:action để có CSRF token. Spring tự xử lý /logout. -->
        <form th:action="@{/logout}" method="post" class="mt-8">
            <button type="submit"
                    class="rounded-lg border border-[#2a3346] bg-[#0d1322] px-5 py-2.5 text-sm font-medium text-slate-200 transition hover:bg-[#10182a]">
                Đăng xuất
            </button>
        </form>
    </div>
</main>

</body>
</html>

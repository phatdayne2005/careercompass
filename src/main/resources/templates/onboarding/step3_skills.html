<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Onboarding — Kỹ năng | CareerCompass')}"></head>
<body class="bg-[#090d16] text-slate-100 font-sans min-h-screen flex flex-col">

<!-- Navigation Bar -->
<nav th:replace="~{layout/base :: appNav('onboarding')}"></nav>

<main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-10 flex-1 w-full">

    <!-- Stepper Tracker -->
    <div class="mb-10 max-w-xl mx-auto">
        <div class="flex items-center justify-between relative">
            <div class="absolute left-0 top-1/2 -translate-y-1/2 h-0.5 w-full bg-slate-800 -z-0"></div>
            
            <!-- Step 1 (Completed) -->
            <div class="relative z-10 flex flex-col items-center">
                <div class="w-9 h-9 rounded-full bg-emerald-600 border-2 border-emerald-400 text-white flex items-center justify-center text-xs font-bold shadow-lg shadow-emerald-600/30">
                    <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg>
                </div>
                <span class="mt-2 text-xs font-semibold text-emerald-400">Mục tiêu</span>
            </div>

            <!-- Step 2 (Completed) -->
            <div class="relative z-10 flex flex-col items-center">
                <div class="w-9 h-9 rounded-full bg-emerald-600 border-2 border-emerald-400 text-white flex items-center justify-center text-xs font-bold shadow-lg shadow-emerald-600/30">
                    <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg>
                </div>
                <span class="mt-2 text-xs font-semibold text-emerald-400">Hồ sơ</span>
            </div>

            <!-- Step 3 (Active) -->
            <div class="relative z-10 flex flex-col items-center">
                <div class="w-9 h-9 rounded-full bg-indigo-600 border-2 border-indigo-400 text-white flex items-center justify-center text-xs font-bold shadow-lg shadow-indigo-600/30">
                    3
                </div>
                <span class="mt-2 text-xs font-semibold text-indigo-400">Kỹ năng hiện có</span>
            </div>
        </div>
    </div>

    <!-- Header Section -->
    <div class="text-center max-w-2xl mx-auto mb-8">
        <h1 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">Bạn đã có những kỹ năng nào?</h1>
        <p class="mt-2 text-sm text-slate-400">Chọn các kỹ năng bạn đã nắm vững — hệ thống sẽ đối sánh và tính toán độ phủ (Skill Gap) cho lộ trình của bạn</p>
    </div>

    <!-- Skills Form -->
    <form th:action="@{/onboarding/step3}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <!-- Category containers -->
        <div class="space-y-6 mb-8" id="skillsContainer">
            <div th:each="group : ${skillsByCategory}" class="rounded-2xl border border-white/[0.08] bg-[#0e1424] p-5 sm:p-6">
                <h3 class="text-xs font-bold uppercase tracking-wider text-indigo-400 mb-4 flex items-center gap-2"
                    th:text="${group.key}">
                    Frontend
                </h3>
                
                <div class="flex flex-wrap gap-2.5">
                    <div th:each="skill : ${group.value}">
                        <input type="checkbox"
                               name="skillIds"
                               th:value="${skill.id}"
                               th:id="'skill_' + ${skill.id}"
                               th:checked="${existingSkillIds != null && existingSkillIds.contains(skill.id)}"
                               class="sr-only peer">
                        <label th:for="'skill_' + ${skill.id}"
                               th:text="${skill.name}"
                               class="inline-flex items-center gap-2 px-4 py-2 rounded-xl border border-slate-700/80 bg-[#131b30]
                                      text-xs sm:text-sm font-medium text-slate-300 cursor-pointer transition-all duration-150
                                      peer-checked:bg-indigo-600/20 peer-checked:border-indigo-500 peer-checked:text-indigo-300 peer-checked:shadow-sm
                                      hover:border-slate-500 hover:text-white select-none">
                        </label>
                    </div>
                </div>
            </div>
        </div>

        <!-- Selected Count Badge -->
        <div class="flex items-center justify-between p-4 rounded-2xl bg-indigo-500/10 border border-indigo-500/20 mb-8">
            <div class="flex items-center gap-2 text-sm font-semibold text-indigo-300">
                <svg class="w-4 h-4 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                <span>
                    <span id="selectedCount" th:text="${existingSkillIds != null ? existingSkillIds.size() : 0}">0</span>
                    <span id="countText" th:text="${existingSkillIds != null && !existingSkillIds.isEmpty() ? ' kỹ năng đã chọn' : ' kỹ năng đã chọn'}"></span>
                </span>
            </div>
            <span class="text-xs text-slate-400">Bạn luôn có thể cập nhật lại trong mục Skill Gap</span>
        </div>

        <!-- Form Actions -->
        <div class="flex items-center justify-between pt-4 border-t border-white/[0.06]">
            <a th:href="@{/onboarding/step2}"
               class="px-5 py-2.5 rounded-xl border border-white/[0.08] text-slate-400 text-sm font-medium hover:text-white hover:bg-white/[0.04] transition">
                ← Quay lại
            </a>
            <button type="submit"
                    class="px-7 py-2.5 rounded-xl bg-gradient-to-r from-indigo-600 to-purple-600 text-white text-sm font-bold shadow-lg shadow-indigo-600/25 hover:opacity-95 transition flex items-center gap-2 cursor-pointer">
                <span>Hoàn tất Onboarding</span>
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg>
            </button>
        </div>
    </form>
</main>

<script>
    function updateCount() {
        const checked = document.querySelectorAll('input[name="skillIds"]:checked').length;
        const countEl = document.getElementById('selectedCount');
        const textEl = document.getElementById('countText');
        if (countEl) countEl.textContent = checked;
        if (textEl) {
            textEl.textContent = checked > 0 ? ' kỹ năng đã chọn ✓' : ' kỹ năng đã chọn';
        }
    }

    document.querySelectorAll('input[name="skillIds"]').forEach(cb => {
        cb.addEventListener('change', updateCount);
    });

    updateCount();
</script>
</body>
</html>

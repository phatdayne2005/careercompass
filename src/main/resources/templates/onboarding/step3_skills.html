<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Onboarding — Khảo sát Kỹ năng | CareerCompass')}"></head>
<body class="bg-[#030712] text-slate-100 font-sans min-h-screen flex flex-col cyber-grid">

<!-- Navigation Bar -->
<nav th:replace="~{layout/base :: appNav('onboarding')}"></nav>

<main class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-10 flex-1 w-full">

    <!-- Cyber Stepper Tracker -->
    <div class="mb-10 max-w-xl mx-auto">
        <div class="flex items-center justify-between relative">
            <div class="absolute left-0 top-1/2 -translate-y-1/2 h-0.5 w-full bg-slate-800 -z-0"></div>
            
            <!-- Step 1 (Done) -->
            <div class="relative z-10 flex flex-col items-center">
                <div class="w-10 h-10 rounded-2xl bg-emerald-500/20 border-2 border-emerald-400 text-emerald-300 flex items-center justify-center text-xs font-black shadow-[0_0_15px_rgba(16,185,129,0.3)]">
                    <svg class="w-4 h-4 text-emerald-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg>
                </div>
                <span class="mt-2 text-xs font-bold text-emerald-400">Mục tiêu nghề</span>
            </div>

            <!-- Step 2 (Done) -->
            <div class="relative z-10 flex flex-col items-center">
                <div class="w-10 h-10 rounded-2xl bg-emerald-500/20 border-2 border-emerald-400 text-emerald-300 flex items-center justify-center text-xs font-black shadow-[0_0_15px_rgba(16,185,129,0.3)]">
                    <svg class="w-4 h-4 text-emerald-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg>
                </div>
                <span class="mt-2 text-xs font-bold text-emerald-400">Hồ sơ / GitHub</span>
            </div>

            <!-- Step 3 (Active) -->
            <div class="relative z-10 flex flex-col items-center">
                <div class="w-10 h-10 rounded-2xl bg-cyan-500/20 border-2 border-cyan-400 text-cyan-300 flex items-center justify-center text-xs font-black shadow-[0_0_20px_rgba(6,182,212,0.4)]">
                    3
                </div>
                <span class="mt-2 text-xs font-bold text-cyan-400">Kỹ năng</span>
            </div>
        </div>
    </div>

    <!-- Header Section -->
    <div class="text-center max-w-2xl mx-auto mb-10">
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-cyan-500/10 border border-cyan-500/20 text-xs font-bold text-cyan-300 mb-3">
            <span class="w-1.5 h-1.5 rounded-full bg-cyan-400 animate-ping"></span>
            <span>Skill Telemetry Survey</span>
        </div>
        <h1 class="text-2xl sm:text-3xl lg:text-4xl font-black text-white tracking-tight">Kỹ năng hiện tại của bạn</h1>
        <p class="mt-2 text-xs sm:text-sm text-slate-400">Chọn những kỹ năng bạn đã tự tin nắm vững &middot; Đã chọn: <span id="selectedCount" class="font-extrabold text-cyan-400">0</span> kỹ năng</p>
    </div>

    <!-- Form -->
    <form th:action="@{/onboarding/step3}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <!-- Category skill groups -->
        <div class="space-y-6 mb-10">
            <div th:each="entry : ${skillsByCategory}"
                 class="cyber-card rounded-3xl p-6 sm:p-7 border border-white/[0.08]">
                
                <div class="flex items-center gap-2.5 mb-4">
                    <span class="w-2.5 h-2.5 rounded-full bg-gradient-to-r from-cyan-400 to-violet-500"></span>
                    <h3 class="font-black text-white text-base uppercase tracking-wider" th:text="${entry.key}">Category</h3>
                </div>

                <div class="flex flex-wrap gap-2.5">
                    <label th:each="skill : ${entry.value}"
                           th:for="'skill_' + ${skill.id}"
                           class="skill-chip cursor-pointer inline-flex items-center gap-2 px-4 py-2 rounded-2xl border border-white/[0.08] bg-[#070b16] hover:border-cyan-400/50 hover:bg-[#0c1424] transition-all text-xs font-semibold text-slate-300 select-none">
                        <input type="checkbox"
                               name="skillIds"
                               th:value="${skill.id}"
                               th:id="'skill_' + ${skill.id}"
                               class="skill-checkbox hidden"
                               onchange="updateSkillChip(this)">
                        <span class="chip-check w-4 h-4 rounded-md border border-slate-600 flex items-center justify-center text-[10px] text-transparent transition-all">
                            ✓
                        </span>
                        <span th:text="${skill.name}">Skill Name</span>
                    </label>
                </div>
            </div>
        </div>

        <!-- Form Actions -->
        <div class="flex items-center justify-between pt-6 border-t border-white/[0.08]">
            <a th:href="@{/onboarding/step2}"
               class="px-5 py-2.5 rounded-2xl border border-white/[0.08] text-slate-400 text-xs sm:text-sm font-bold hover:text-white hover:bg-white/[0.04] transition">
                ← Quay lại
            </a>
            <button type="submit"
                    class="px-8 py-2.5 rounded-2xl bg-gradient-to-r from-cyan-500 via-indigo-500 to-violet-600 text-white text-xs sm:text-sm font-black shadow-lg shadow-cyan-500/25 hover:opacity-95 transition cursor-pointer">
                Hoàn tất &amp; Khởi tạo Lộ trình →
            </button>
        </div>
    </form>
</main>

<script>
    function updateSkillChip(checkbox) {
        const label = checkbox.closest('label');
        const checkIcon = label.querySelector('.chip-check');

        if (checkbox.checked) {
            label.classList.add('border-cyan-400', 'bg-cyan-500/15', 'text-cyan-200', 'glow-cyan');
            label.classList.remove('border-white/[0.08]', 'bg-[#070b16]', 'text-slate-300');
            checkIcon.classList.add('bg-cyan-400', 'border-cyan-400', 'text-slate-950', 'font-black');
            checkIcon.classList.remove('border-slate-600', 'text-transparent');
        } else {
            label.classList.remove('border-cyan-400', 'bg-cyan-500/15', 'text-cyan-200', 'glow-cyan');
            label.classList.add('border-white/[0.08]', 'bg-[#070b16]', 'text-slate-300');
            checkIcon.classList.remove('bg-cyan-400', 'border-cyan-400', 'text-slate-950', 'font-black');
            checkIcon.classList.add('border-slate-600', 'text-transparent');
        }

        const count = document.querySelectorAll('.skill-checkbox:checked').length;
        document.getElementById('selectedCount').textContent = count;
    }
</script>
</body>
</html>

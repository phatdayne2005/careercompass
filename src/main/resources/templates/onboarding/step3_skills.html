<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Onboarding — Kỹ năng | CareerCompass')}"></head>
<body class="bg-[#0F172A] text-white font-sans min-h-screen">

<nav th:replace="~{layout/base :: appNav('onboarding')}"></nav>

<main class="max-w-4xl mx-auto px-6 py-12">

    <!-- Header -->
    <div class="mb-8">
        <div class="flex items-center gap-3 mb-1">
            <span class="w-8 h-8 rounded-full bg-[#3B82F6] flex items-center justify-center text-sm font-bold">11</span>
            <h1 class="text-2xl font-bold text-white">Onboarding — Bước 3 / 3</h1>
        </div>
        <p class="text-sm text-slate-400 pl-11">FR3.1 chọn các kỹ năng đã thành thạo từ danh sách</p>
    </div>

    <!-- Stepper -->
    <div class="flex items-center gap-3 mb-12 pl-2">
        <div class="flex items-center gap-2">
            <span class="w-6 h-6 rounded-full bg-emerald-500 flex items-center justify-center">
                <svg class="w-3 h-3 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg>
            </span>
            <span class="text-sm text-emerald-400 font-semibold">Mục tiêu</span>
        </div>
        <div class="flex-1 h-px bg-emerald-500 max-w-[80px]"></div>
        <div class="flex items-center gap-2">
            <span class="w-6 h-6 rounded-full bg-emerald-500 flex items-center justify-center">
                <svg class="w-3 h-3 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg>
            </span>
            <span class="text-sm text-emerald-400 font-semibold">Hồ sơ</span>
        </div>
        <div class="flex-1 h-px bg-[#3B82F6] max-w-[80px]"></div>
        <div class="flex items-center gap-2">
            <span class="w-6 h-6 rounded-full bg-[#3B82F6] flex items-center justify-center text-xs font-bold">3</span>
            <span class="text-sm font-semibold text-[#3B82F6]">Kỹ năng hiện có</span>
        </div>
    </div>

    <!-- Title -->
    <div class="mb-6">
        <h2 class="text-2xl font-bold text-white mb-2">Bạn đã có những kỹ năng nào?</h2>
        <p class="text-slate-400 text-sm">Chọn kỹ năng đã thành thạo — hệ thống dùng để phân tích Skill Gap (FR3.2)</p>
    </div>

    <!-- Form -->
    <form th:action="@{/onboarding/step3}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <!-- Category label -->
        <p class="text-xs text-slate-500 mb-6">Bấm để chọn / bỏ chọn — kỹ năng nhóm theo lĩnh vực</p>

        <!-- Skills grouped by category -->
        <div class="space-y-6 mb-6" id="skillsContainer">
            <div th:each="group : ${skillsByCategory}">
                <h3 class="text-xs font-semibold uppercase tracking-wide text-[#8B5CF6] mb-3"
                    th:text="${group.key}">Frontend</h3>
                <div class="flex flex-wrap gap-2">
                    <div th:each="skill : ${group.value}">
                        <input type="checkbox"
                               name="skillIds"
                               th:value="${skill.id}"
                               th:id="'skill_' + ${skill.id}"
                               th:checked="${existingSkillIds != null && existingSkillIds.contains(skill.id)}"
                               class="sr-only peer">
                        <label th:for="'skill_' + ${skill.id}"
                               th:text="${skill.name}"
                               class="inline-flex items-center gap-1.5 px-4 py-2 rounded-full border border-[#334155] bg-[#1E293B]
                                      text-sm text-slate-400 cursor-pointer transition-all duration-150
                                      peer-checked:bg-[#8B5CF6]/20 peer-checked:border-[#8B5CF6] peer-checked:text-[#a78bfa]
                                      hover:border-slate-500 hover:text-slate-200 select-none">
                        </label>
                    </div>
                </div>
            </div>
        </div>

        <!-- Skill count badge -->
        <p class="text-sm text-[#8B5CF6] font-medium mb-8">
            <span id="selectedCount">
                <span th:text="${existingSkillIds != null ? existingSkillIds.size() : 0}">0</span>
            </span>
            <span id="countText">
                <span th:text="${existingSkillIds != null && !existingSkillIds.isEmpty() ? ' kỹ năng đã chọn ✓' : ' kỹ năng đã chọn'}"></span>
            </span>
        </p>

        <!-- Actions -->
        <div class="flex items-center justify-between">
            <a th:href="@{/onboarding/step2}"
               class="px-5 py-2.5 rounded-xl border border-[#334155] text-slate-400 text-sm hover:text-white hover:border-slate-500 transition">
                ← Quay lại
            </a>
            <button type="submit"
                    class="px-6 py-2.5 rounded-xl bg-[#3B82F6] text-white text-sm font-semibold hover:bg-blue-500 transition flex items-center gap-2">
                Hoàn tất
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg>
            </button>
        </div>
    </form>
</main>

<script>
    // Cập nhật số đếm kỹ năng đã chọn realtime
    function updateCount() {
        const checked = document.querySelectorAll('input[name="skillIds"]:checked').length;
        document.getElementById('selectedCount').textContent = checked;
        document.getElementById('countText').textContent = checked > 0
            ? ` kỹ năng đã chọn ✓`
            : ` kỹ năng đã chọn`;
    }

    document.querySelectorAll('input[name="skillIds"]').forEach(cb => {
        cb.addEventListener('change', updateCount);
    });

    // Khởi tạo đếm khi tải trang
    updateCount();
</script>
</body>
</html>

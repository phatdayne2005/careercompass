<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Onboarding — Chọn nghề nghiệp | CareerCompass')}"></head>
<body class="bg-[#090d16] text-slate-100 font-sans min-h-screen flex flex-col">

<!-- Navigation Bar -->
<nav th:replace="~{layout/base :: appNav('onboarding')}"></nav>

<main class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-10 flex-1 w-full">

    <!-- Stepper Tracker -->
    <div class="mb-10 max-w-xl mx-auto">
        <div class="flex items-center justify-between relative">
            <div class="absolute left-0 top-1/2 -translate-y-1/2 h-0.5 w-full bg-slate-800 -z-0"></div>
            
            <!-- Step 1 -->
            <div class="relative z-10 flex flex-col items-center">
                <div class="w-9 h-9 rounded-full bg-indigo-600 border-2 border-indigo-400 text-white flex items-center justify-center text-xs font-bold shadow-lg shadow-indigo-600/30">
                    1
                </div>
                <span class="mt-2 text-xs font-semibold text-indigo-400">Mục tiêu nghề</span>
            </div>

            <!-- Step 2 -->
            <div class="relative z-10 flex flex-col items-center">
                <div class="w-9 h-9 rounded-full bg-slate-900 border border-slate-700 text-slate-400 flex items-center justify-center text-xs font-bold">
                    2
                </div>
                <span class="mt-2 text-xs font-medium text-slate-500">Hồ sơ / GitHub</span>
            </div>

            <!-- Step 3 -->
            <div class="relative z-10 flex flex-col items-center">
                <div class="w-9 h-9 rounded-full bg-slate-900 border border-slate-700 text-slate-400 flex items-center justify-center text-xs font-bold">
                    3
                </div>
                <span class="mt-2 text-xs font-medium text-slate-500">Kỹ năng</span>
            </div>
        </div>
    </div>

    <!-- Header Section -->
    <div class="text-center max-w-2xl mx-auto mb-10">
        <h1 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">Bạn muốn theo đuổi vị trí nào?</h1>
        <p class="mt-2 text-sm text-slate-400">Chọn 1 Target Career Role — Hệ thống AI sẽ tự động cá nhân hóa lộ trình kỹ năng phù hợp cho bạn</p>
    </div>

    <!-- Error message if any -->
    <div th:if="${error}" class="max-w-2xl mx-auto mb-6 px-4 py-3 bg-rose-500/10 border border-rose-500/30 rounded-2xl text-rose-300 text-sm flex items-center gap-2">
        <svg class="w-4 h-4 shrink-0 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        <span th:text="${error}"></span>
    </div>

    <!-- Selection Form -->
    <form th:action="@{/onboarding/step1}" method="post" id="step1Form">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <input type="hidden" name="roleId" id="selectedRoleId" value="">

        <!-- Role cards grid -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-6 mb-10">
            <div th:each="role : ${roles}"
                 th:data-roleid="${role.id}"
                 onclick="selectRole(this)"
                 class="role-card group relative cursor-pointer rounded-2xl border border-white/[0.08] bg-[#0e1424] hover:bg-[#131b30] p-6 transition-all duration-200 hover:border-indigo-500/50 hover:shadow-xl hover:shadow-indigo-500/10">

                <!-- Selected badge -->
                <span class="selected-badge absolute top-4 right-4 hidden items-center gap-1 text-xs font-semibold px-2.5 py-1 rounded-full bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg>
                    Đã chọn
                </span>

                <!-- Career Role Icon -->
                <div class="w-11 h-11 rounded-xl bg-indigo-600/15 border border-indigo-500/20 flex items-center justify-center mb-5 group-hover:scale-105 transition-transform duration-200">
                    <svg class="w-5 h-5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/>
                    </svg>
                </div>

                <h3 class="font-bold text-white text-lg mb-1.5 group-hover:text-indigo-300 transition-colors" th:text="${role.name}">Role Name</h3>
                <p class="text-xs text-slate-400 leading-relaxed line-clamp-3" th:text="${role.description}">Mô tả ngắn về vị trí này...</p>
            </div>
        </div>

        <!-- Form Actions -->
        <div class="flex items-center justify-end gap-3 pt-4 border-t border-white/[0.06]">
            <button type="submit" name="skip" value="true"
                    class="px-5 py-2.5 rounded-xl border border-white/[0.08] text-slate-400 text-sm font-medium hover:text-white hover:bg-white/[0.04] transition cursor-pointer">
                Bỏ qua
            </button>
            <button type="submit" id="nextBtn" disabled
                    class="px-7 py-2.5 rounded-xl bg-indigo-600 text-white text-sm font-bold shadow-lg shadow-indigo-600/20 disabled:opacity-40 disabled:cursor-not-allowed hover:bg-indigo-500 transition-all cursor-pointer">
                Tiếp tục →
            </button>
        </div>
    </form>
</main>

<script>
    function selectRole(card) {
        document.querySelectorAll('.role-card').forEach(c => {
            c.classList.remove('border-indigo-500', 'bg-[#141d34]', 'ring-2', 'ring-indigo-500/40');
            c.classList.add('border-white/[0.08]', 'bg-[#0e1424]');
            const badge = c.querySelector('.selected-badge');
            if (badge) {
                badge.classList.add('hidden');
                badge.classList.remove('flex');
            }
        });

        card.classList.add('border-indigo-500', 'bg-[#141d34]', 'ring-2', 'ring-indigo-500/40');
        card.classList.remove('border-white/[0.08]', 'bg-[#0e1424]');
        const activeBadge = card.querySelector('.selected-badge');
        if (activeBadge) {
            activeBadge.classList.remove('hidden');
            activeBadge.classList.add('flex');
        }

        document.getElementById('selectedRoleId').value = card.dataset.roleid;
        document.getElementById('nextBtn').disabled = false;
    }
</script>
</body>
</html>

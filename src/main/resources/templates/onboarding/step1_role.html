<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Onboarding — Chọn nghề nghiệp | CareerCompass')}"></head>
<body class="bg-[#030712] text-slate-100 font-sans min-h-screen flex flex-col cyber-grid">

<!-- Navigation Bar -->
<nav th:replace="~{layout/base :: appNav('onboarding')}"></nav>

<main class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-10 flex-1 w-full">

    <!-- Cyber Stepper Tracker -->
    <div class="mb-10 max-w-xl mx-auto">
        <div class="flex items-center justify-between relative">
            <div class="absolute left-0 top-1/2 -translate-y-1/2 h-0.5 w-full bg-slate-800 -z-0"></div>
            
            <!-- Step 1 (Active) -->
            <div class="relative z-10 flex flex-col items-center">
                <div class="w-10 h-10 rounded-2xl bg-cyan-500/20 border-2 border-cyan-400 text-cyan-300 flex items-center justify-center text-xs font-black shadow-[0_0_20px_rgba(6,182,212,0.4)]">
                    1
                </div>
                <span class="mt-2 text-xs font-bold text-cyan-400">Mục tiêu nghề</span>
            </div>

            <!-- Step 2 -->
            <div class="relative z-10 flex flex-col items-center">
                <div class="w-10 h-10 rounded-2xl bg-[#090d16] border border-slate-800 text-slate-500 flex items-center justify-center text-xs font-bold">
                    2
                </div>
                <span class="mt-2 text-xs font-medium text-slate-500">Hồ sơ / GitHub</span>
            </div>

            <!-- Step 3 -->
            <div class="relative z-10 flex flex-col items-center">
                <div class="w-10 h-10 rounded-2xl bg-[#090d16] border border-slate-800 text-slate-500 flex items-center justify-center text-xs font-bold">
                    3
                </div>
                <span class="mt-2 text-xs font-medium text-slate-500">Kỹ năng</span>
            </div>
        </div>
    </div>

    <!-- Header Section -->
    <div class="text-center max-w-2xl mx-auto mb-10">
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-cyan-500/10 border border-cyan-500/20 text-xs font-bold text-cyan-300 mb-3">
            <span class="w-1.5 h-1.5 rounded-full bg-cyan-400 animate-ping"></span>
            <span>Target Role Specification</span>
        </div>
        <h1 class="text-2xl sm:text-3xl lg:text-4xl font-black text-white tracking-tight">Bạn muốn theo đuổi vị trí nào?</h1>
        <p class="mt-2 text-xs sm:text-sm text-slate-400">Chọn 1 Target Career Role — Hệ thống AI sẽ tự động sinh cây kỹ năng phù hợp</p>
    </div>

    <!-- Error message if any -->
    <div th:if="${error}" class="max-w-2xl mx-auto mb-6 px-4 py-3 bg-rose-500/10 border border-rose-500/30 rounded-2xl text-rose-300 text-xs sm:text-sm flex items-center gap-2">
        <svg class="w-4 h-4 shrink-0 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        <span th:text="${error}"></span>
    </div>

    <!-- Selection Form -->
    <form th:action="@{/onboarding/step1}" method="post" id="step1Form">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <input type="hidden" name="roleId" id="selectedRoleId" value="">

        <!-- Role cards grid -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5 sm:gap-6 mb-10">
            <div th:each="role : ${roles}"
                 th:data-roleid="${role.id}"
                 onclick="selectRole(this)"
                 class="role-card cyber-card cyber-card-interactive group relative cursor-pointer rounded-3xl p-6 sm:p-7 border border-white/[0.08] hover:border-cyan-400/50">

                <!-- Selected badge -->
                <span class="selected-badge absolute top-5 right-5 hidden items-center gap-1.5 text-xs font-extrabold px-3 py-1 rounded-full bg-cyan-500/20 text-cyan-300 border border-cyan-400/40 shadow-[0_0_15px_rgba(6,182,212,0.3)]">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg>
                    ĐÃ CHỌN
                </span>

                <!-- Career Role Holographic Icon -->
                <div class="w-12 h-12 rounded-2xl bg-cyan-500/10 border border-cyan-400/20 flex items-center justify-center mb-5 group-hover:scale-110 group-hover:border-cyan-400 transition-all duration-200">
                    <svg class="w-6 h-6 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/>
                    </svg>
                </div>

                <h3 class="font-black text-white text-lg mb-1.5 group-hover:text-cyan-300 transition-colors" th:text="${role.name}">Role Name</h3>
                <p class="text-xs text-slate-400 leading-relaxed line-clamp-3" th:text="${role.description}">Mô tả ngắn về vị trí này...</p>
            </div>
        </div>

        <!-- Form Actions -->
        <div class="flex items-center justify-end gap-3 pt-6 border-t border-white/[0.08]">
            <button type="submit" name="skip" value="true"
                    class="px-5 py-2.5 rounded-2xl border border-white/[0.08] text-slate-400 text-xs sm:text-sm font-bold hover:text-white hover:bg-white/[0.04] transition cursor-pointer">
                Bỏ qua
            </button>
            <button type="submit" id="nextBtn" disabled
                    class="px-8 py-2.5 rounded-2xl bg-gradient-to-r from-cyan-500 to-violet-600 text-white text-xs sm:text-sm font-black shadow-lg shadow-cyan-500/25 disabled:opacity-30 disabled:cursor-not-allowed hover:opacity-95 transition-all cursor-pointer">
                Tiếp tục →
            </button>
        </div>
    </form>
</main>

<script>
    function selectRole(card) {
        document.querySelectorAll('.role-card').forEach(c => {
            c.classList.remove('border-cyan-400', 'bg-[#0f1a30]', 'ring-2', 'ring-cyan-400/40', 'glow-cyan');
            c.classList.add('border-white/[0.08]');
            const badge = c.querySelector('.selected-badge');
            if (badge) {
                badge.classList.add('hidden');
                badge.classList.remove('flex');
            }
        });

        card.classList.add('border-cyan-400', 'bg-[#0f1a30]', 'ring-2', 'ring-cyan-400/40', 'glow-cyan');
        card.classList.remove('border-white/[0.08]');
        const activeBadge = card.querySelector('.selected-badge');
        if (activeBadge) {
            activeBadge.classList.remove('hidden');
            activeBadge.classList.add('flex');
        }

        document.getElementById('selectedRoleId').value = card.dataset.roleid;
        document.getElementById('nextBtn').disabled = false;
    }
</script>
</body>
</html>

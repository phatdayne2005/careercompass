<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<!--
  Layout chung cho toàn app CareerCompass - Phong cách Cyber AI & Aurora Glassmorphism.
-->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">CareerCompass · Cyber AI</title>
    
    <!-- CSRF Tokens for Spring Security -->
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>

    <!-- Google Fonts & Custom CSS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">

    <!-- HTMX & Tailwind CDN -->
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace']
                    },
                    colors: {
                        cyber: {
                            cyan: '#06b6d4',
                            violet: '#8b5cf6',
                            fuchsia: '#d946ef',
                            emerald: '#10b981',
                            amber: '#f59e0b',
                            rose: '#f43f5e',
                            dark: '#030712',
                            panel: '#0d1424',
                            subpanel: '#090e1c',
                        }
                    }
                }
            }
        }
    </script>
    <script th:src="@{/js/app.js}" defer></script>
</head>
<body class="bg-[#030712] font-sans text-slate-200 antialiased selection:bg-cyan-500 selection:text-black min-h-screen flex flex-col relative cyber-grid">

<!-- Background Ambient Aurora Glows -->
<div class="fixed top-0 left-1/4 w-[500px] h-[350px] aurora-orb-cyan blur-[120px] pointer-events-none -z-10"></div>
<div class="fixed top-1/3 right-10 w-[500px] h-[400px] aurora-orb-violet blur-[140px] pointer-events-none -z-10"></div>
<div class="fixed bottom-10 left-10 w-[450px] h-[350px] aurora-orb-fuchsia blur-[130px] pointer-events-none -z-10"></div>

<!-- Brand Logo Component -->
<div th:fragment="brand" class="flex items-center gap-3 group cursor-pointer">
    <div class="relative flex items-center justify-center">
        <span class="absolute -inset-1.5 rounded-xl bg-gradient-to-r from-cyan-500 via-violet-500 to-fuchsia-500 opacity-70 blur-md group-hover:opacity-100 transition duration-300 animate-pulse"></span>
        <div class="relative w-7 h-7 rounded-lg bg-[#0d1424] border border-cyan-400/50 flex items-center justify-center shadow-lg shadow-cyan-500/30">
            <span class="inline-block w-3.5 h-3.5 rotate-45 rounded-[2px] bg-gradient-to-br from-cyan-400 via-violet-400 to-fuchsia-500"></span>
        </div>
    </div>
    <div class="flex flex-col">
        <span class="text-base sm:text-lg font-black tracking-tight text-white flex items-center gap-1">
            <span>Career</span><span class="text-gradient-cyan-violet">Compass</span>
        </span>
        <span class="text-[9px] font-mono tracking-widest uppercase text-cyan-400 font-bold -mt-1 opacity-80">AI HUD Platform</span>
    </div>
</div>

<!-- Floating Glass Navigation Bar -->
<nav th:fragment="appNav(active)" class="sticky top-0 z-40 h-16 bg-[#030712]/80 backdrop-blur-2xl border-b border-white/[0.08] transition-all">
    <div class="max-w-7xl mx-auto h-full px-4 sm:px-6 lg:px-8 flex items-center justify-between">
        
        <!-- Brand -->
        <a th:href="@{/}" class="flex items-center gap-3">
            <div class="relative flex items-center justify-center">
                <span class="absolute -inset-1 rounded-lg bg-gradient-to-r from-cyan-500 to-violet-500 opacity-60 blur-sm"></span>
                <div class="relative w-6 h-6 rounded-md bg-[#0d1424] border border-cyan-400/50 flex items-center justify-center">
                    <span class="inline-block w-2.5 h-2.5 rotate-45 rounded-[2px] bg-gradient-to-br from-cyan-400 via-violet-400 to-fuchsia-500"></span>
                </div>
            </div>
            <span class="text-base font-extrabold tracking-tight text-white">Career<span class="text-gradient-cyan-violet">Compass</span></span>
        </a>

        <!-- Desktop Navigation Pills -->
        <div class="hidden lg:flex items-center gap-1 text-[13px] font-semibold text-slate-300 bg-[#0d1424]/90 p-1.5 rounded-2xl border border-white/[0.08] shadow-lg shadow-black/40 backdrop-blur-xl">
            <a th:href="@{/dashboard}" 
               class="px-3.5 py-1.5 rounded-xl transition-all duration-200 hover:text-white"
               th:classappend="${active == 'dashboard'} ? ' bg-cyan-500/15 text-cyan-300 font-bold border border-cyan-500/30 shadow-[0_0_15px_rgba(6,182,212,0.25)]' : ' hover:bg-white/[0.04]'">
               Dashboard
            </a>
            <a th:href="@{/mentor}" 
               class="px-3.5 py-1.5 rounded-xl transition-all duration-200 hover:text-white flex items-center gap-1.5"
               th:classappend="${active == 'mentor'} ? ' bg-violet-500/15 text-violet-300 font-bold border border-violet-500/30 shadow-[0_0_15px_rgba(139,92,246,0.25)]' : ' hover:bg-white/[0.04]'">
               <span class="w-1.5 h-1.5 rounded-full bg-cyan-400 animate-ping"></span>
               AI Mentor
            </a>
            <a th:href="@{/roadmap}" 
               class="px-3.5 py-1.5 rounded-xl transition-all duration-200 hover:text-white"
               th:classappend="${active == 'roadmap'} ? ' bg-cyan-500/15 text-cyan-300 font-bold border border-cyan-500/30 shadow-[0_0_15px_rgba(6,182,212,0.25)]' : ' hover:bg-white/[0.04]'">
               Roadmap
            </a>
            <a th:href="@{/skill-gap}" 
               class="px-3.5 py-1.5 rounded-xl transition-all duration-200 hover:text-white"
               th:classappend="${active == 'skill-gap'} ? ' bg-cyan-500/15 text-cyan-300 font-bold border border-cyan-500/30 shadow-[0_0_15px_rgba(6,182,212,0.25)]' : ' hover:bg-white/[0.04]'">
               Skill Gap
            </a>
            <a th:href="@{/market/pulse}" 
               class="px-3.5 py-1.5 rounded-xl transition-all duration-200 hover:text-white"
               th:classappend="${active == 'market'} ? ' bg-cyan-500/15 text-cyan-300 font-bold border border-cyan-500/30 shadow-[0_0_15px_rgba(6,182,212,0.25)]' : ' hover:bg-white/[0.04]'">
               Market Pulse
            </a>
            <a th:href="@{/portfolio/manage}" 
               class="px-3.5 py-1.5 rounded-xl transition-all duration-200 hover:text-white"
               th:classappend="${active == 'portfolio'} ? ' bg-cyan-500/15 text-cyan-300 font-bold border border-cyan-500/30 shadow-[0_0_15px_rgba(6,182,212,0.25)]' : ' hover:bg-white/[0.04]'">
               E-Portfolio
            </a>
        </div>

        <!-- Right User Actions (Desktop) -->
        <div class="hidden sm:flex items-center gap-3">
            <a th:href="@{/profile}" 
               class="flex items-center gap-2 px-3.5 py-1.5 text-xs font-bold text-slate-300 hover:text-cyan-300 bg-[#0d1424] hover:bg-[#131d34] border border-white/[0.08] hover:border-cyan-500/30 rounded-xl transition shadow-sm">
                <svg class="w-3.5 h-3.5 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                </svg>
                <span>Hồ sơ</span>
            </a>

            <form th:action="@{/logout}" method="post" class="inline">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit"
                        class="flex items-center gap-1.5 rounded-xl bg-[#0d1424] hover:bg-rose-500/10 hover:text-rose-400 hover:border-rose-500/30 border border-white/[0.08] px-3.5 py-1.5 text-xs font-bold text-slate-400 transition cursor-pointer"
                        aria-label="Đăng xuất">
                    <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                    </svg>
                    <span>Đăng xuất</span>
                </button>
            </form>
        </div>

        <!-- Mobile Hamburger Toggle -->
        <div class="flex lg:hidden items-center gap-2">
            <button id="mobileMenuBtn" type="button" class="p-2 rounded-xl text-slate-300 hover:text-cyan-400 bg-[#0d1424] border border-white/[0.08]" aria-label="Menu">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </button>
        </div>
    </div>
</nav>

<!-- Mobile Navigation Drawer -->
<div id="mobileDrawerBackdrop" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden transition-opacity"></div>
<div id="mobileDrawer" class="fixed top-0 right-0 bottom-0 w-80 bg-[#070b16] border-l border-white/[0.08] z-50 p-6 flex flex-col justify-between translate-x-full transition-transform duration-300 ease-in-out lg:hidden shadow-2xl">
    <div>
        <div class="flex items-center justify-between pb-6 border-b border-white/[0.08]">
            <div th:replace="~{layout/base :: brand}"></div>
            <button id="closeMobileMenuBtn" class="p-2 rounded-xl text-slate-400 hover:text-white bg-white/[0.04]">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>

        <nav class="mt-6 flex flex-col space-y-2">
            <a th:href="@{/dashboard}" class="flex items-center gap-3 px-4 py-2.5 rounded-xl text-xs font-bold transition"
               th:classappend="${active == 'dashboard'} ? 'bg-cyan-500/15 text-cyan-300 border border-cyan-500/30' : 'text-slate-300 hover:bg-white/[0.04]'">
                Dashboard
            </a>
            <a th:href="@{/mentor}" class="flex items-center gap-3 px-4 py-2.5 rounded-xl text-xs font-bold transition"
               th:classappend="${active == 'mentor'} ? 'bg-violet-500/15 text-violet-300 border border-violet-500/30' : 'text-slate-300 hover:bg-white/[0.04]'">
                AI Mentor
            </a>
            <a th:href="@{/roadmap}" class="flex items-center gap-3 px-4 py-2.5 rounded-xl text-xs font-bold transition"
               th:classappend="${active == 'roadmap'} ? 'bg-cyan-500/15 text-cyan-300 border border-cyan-500/30' : 'text-slate-300 hover:bg-white/[0.04]'">
                Roadmap
            </a>
            <a th:href="@{/skill-gap}" class="flex items-center gap-3 px-4 py-2.5 rounded-xl text-xs font-bold transition"
               th:classappend="${active == 'skill-gap'} ? 'bg-cyan-500/15 text-cyan-300 border border-cyan-500/30' : 'text-slate-300 hover:bg-white/[0.04]'">
                Skill Gap
            </a>
            <a th:href="@{/market/pulse}" class="flex items-center gap-3 px-4 py-2.5 rounded-xl text-xs font-bold transition"
               th:classappend="${active == 'market'} ? 'bg-cyan-500/15 text-cyan-300 border border-cyan-500/30' : 'text-slate-300 hover:bg-white/[0.04]'">
                Market Pulse
            </a>
            <a th:href="@{/portfolio/manage}" class="flex items-center gap-3 px-4 py-2.5 rounded-xl text-xs font-bold transition"
               th:classappend="${active == 'portfolio'} ? 'bg-cyan-500/15 text-cyan-300 border border-cyan-500/30' : 'text-slate-300 hover:bg-white/[0.04]'">
                E-Portfolio
            </a>
        </nav>
    </div>

    <div class="pt-6 border-t border-white/[0.08] space-y-2">
        <a th:href="@{/profile}" class="flex items-center gap-2.5 w-full px-4 py-2.5 rounded-xl text-xs font-bold text-slate-300 hover:bg-white/[0.04]">
            <svg class="w-4 h-4 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
            <span>Hồ sơ cá nhân</span>
        </a>
        <form th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="flex items-center gap-2.5 w-full px-4 py-2.5 rounded-xl text-xs font-bold text-rose-400 hover:bg-rose-500/10">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                <span>Đăng xuất</span>
            </button>
        </form>
    </div>
</div>

</body>
</html>

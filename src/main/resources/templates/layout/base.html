<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<!--
  Layout chung cho toàn app CareerCompass.
  - head(title): mảnh <head> tham số hoá (Tailwind CDN + Google Fonts + app.css + CSRF).
  - brand: logo CareerCompass đồng nhất cho toàn hệ thống.
  - appNav(active): thanh điều hướng chính cho sinh viên/cố vấn với hỗ trợ Mobile Drawer.
-->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">CareerCompass</title>
    
    <!-- CSRF Tokens for Spring Security -->
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>

    <!-- Google Fonts & Custom CSS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">

    <!-- HTMX & Tailwind CDN -->
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace']
                    },
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            200: '#c7d2fe',
                            300: '#a5b4fc',
                            400: '#818cf8',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            800: '#3730a3',
                            900: '#312e81',
                            950: '#1e1b4b',
                        },
                        dark: {
                            950: '#090d16',
                            900: '#0f172a',
                            850: '#131c31',
                            800: '#1e293b',
                            700: '#334155',
                            600: '#475569',
                        }
                    }
                }
            }
        }
    </script>
    <script th:src="@{/js/app.js}" defer></script>
</head>
<body class="bg-[#090d16] font-sans text-slate-200 antialiased selection:bg-indigo-500 selection:text-white min-h-screen flex flex-col">

<!-- Logo thương hiệu: viên kim cương gradient tím phát sáng + tên ứng dụng -->
<div th:fragment="brand" class="flex items-center gap-2.5 group cursor-pointer">
    <div class="relative flex items-center justify-center">
        <span class="absolute -inset-1 rounded-lg bg-gradient-to-r from-violet-600 to-indigo-600 opacity-60 blur-sm group-hover:opacity-100 transition duration-300"></span>
        <span class="relative inline-block w-4 h-4 rotate-45 rounded-[3px] bg-gradient-to-br from-indigo-400 via-violet-500 to-purple-600 border border-white/20"></span>
    </div>
    <span class="text-lg font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-white via-slate-100 to-slate-300">Career<span class="text-indigo-400">Compass</span></span>
</div>

<!-- Navigation Bar chính -->
<nav th:fragment="appNav(active)" class="sticky top-0 z-40 h-16 bg-[#090d16]/80 backdrop-blur-xl border-b border-white/[0.06] transition-all">
    <div class="max-w-7xl mx-auto h-full px-4 sm:px-6 lg:px-8 flex items-center justify-between">
        
        <!-- Logo -->
        <a th:href="@{/}" class="flex items-center gap-2.5">
            <div class="relative flex items-center justify-center">
                <span class="absolute -inset-1 rounded-lg bg-gradient-to-r from-violet-600 to-indigo-600 opacity-60 blur-sm"></span>
                <span class="relative inline-block w-4 h-4 rotate-45 rounded-[3px] bg-gradient-to-br from-indigo-400 via-violet-500 to-purple-600 border border-white/20"></span>
            </div>
            <span class="text-[17px] font-extrabold tracking-tight text-white">Career<span class="text-indigo-400">Compass</span></span>
        </a>

        <!-- Desktop Navigation Links -->
        <div class="hidden lg:flex items-center gap-1.5 text-[14px] font-medium text-slate-300 bg-slate-900/60 p-1.5 rounded-full border border-white/[0.05]">
            <a th:href="@{/dashboard}" 
               class="px-3.5 py-1.5 rounded-full transition-all duration-200 hover:text-white"
               th:classappend="${active == 'dashboard'} ? ' bg-indigo-600/20 text-indigo-300 font-semibold border border-indigo-500/30' : ' hover:bg-white/[0.04]'">
               Dashboard
            </a>
            <a th:href="@{/mentor}" 
               class="px-3.5 py-1.5 rounded-full transition-all duration-200 hover:text-white flex items-center gap-1.5"
               th:classappend="${active == 'mentor'} ? ' bg-indigo-600/20 text-indigo-300 font-semibold border border-indigo-500/30' : ' hover:bg-white/[0.04]'">
               <span class="w-1.5 h-1.5 rounded-full bg-violet-400 animate-pulse"></span>
               AI Mentor
            </a>
            <a th:href="@{/roadmap}" 
               class="px-3.5 py-1.5 rounded-full transition-all duration-200 hover:text-white"
               th:classappend="${active == 'roadmap'} ? ' bg-indigo-600/20 text-indigo-300 font-semibold border border-indigo-500/30' : ' hover:bg-white/[0.04]'">
               Roadmap
            </a>
            <a th:href="@{/skill-gap}" 
               class="px-3.5 py-1.5 rounded-full transition-all duration-200 hover:text-white"
               th:classappend="${active == 'skill-gap'} ? ' bg-indigo-600/20 text-indigo-300 font-semibold border border-indigo-500/30' : ' hover:bg-white/[0.04]'">
               Skill Gap
            </a>
            <a th:href="@{/market/pulse}" 
               class="px-3.5 py-1.5 rounded-full transition-all duration-200 hover:text-white"
               th:classappend="${active == 'market'} ? ' bg-indigo-600/20 text-indigo-300 font-semibold border border-indigo-500/30' : ' hover:bg-white/[0.04]'">
               Market Pulse
            </a>
            <a th:href="@{/portfolio/manage}" 
               class="px-3.5 py-1.5 rounded-full transition-all duration-200 hover:text-white"
               th:classappend="${active == 'portfolio'} ? ' bg-indigo-600/20 text-indigo-300 font-semibold border border-indigo-500/30' : ' hover:bg-white/[0.04]'">
               E-Portfolio
            </a>
        </div>

        <!-- Right User Actions (Desktop) -->
        <div class="hidden sm:flex items-center gap-3">
            <a th:href="@{/profile}" 
               class="flex items-center gap-2 px-3.5 py-1.5 text-xs font-semibold text-slate-300 hover:text-white bg-slate-900 hover:bg-slate-800 border border-white/[0.08] rounded-xl transition shadow-sm">
                <svg class="w-4 h-4 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                </svg>
                <span>Hồ sơ</span>
            </a>

            <form th:action="@{/logout}" method="post" class="inline">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit"
                        class="flex items-center gap-1.5 rounded-xl bg-slate-800/80 hover:bg-rose-500/10 hover:text-rose-400 hover:border-rose-500/30 border border-white/[0.06] px-3.5 py-1.5 text-xs font-semibold text-slate-300 transition-all cursor-pointer"
                        aria-label="Đăng xuất">
                    <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                    </svg>
                    <span>Đăng xuất</span>
                </button>
            </form>
        </div>

        <!-- Mobile Menu Toggle Button -->
        <div class="flex lg:hidden items-center gap-2">
            <button id="mobileMenuBtn" type="button" class="p-2 rounded-xl text-slate-400 hover:text-white bg-slate-900 border border-white/[0.08]" aria-label="Menu">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </button>
        </div>
    </div>
</nav>

<!-- Mobile Navigation Drawer -->
<div id="mobileDrawerBackdrop" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden transition-opacity"></div>
<div id="mobileDrawer" class="fixed top-0 right-0 bottom-0 w-72 bg-[#0d1322] border-l border-white/[0.08] z-50 p-6 flex flex-col justify-between translate-x-full transition-transform duration-300 ease-in-out lg:hidden">
    <div>
        <div class="flex items-center justify-between pb-6 border-b border-white/[0.06]">
            <div th:replace="~{layout/base :: brand}"></div>
            <button id="closeMobileMenuBtn" class="p-1.5 rounded-lg text-slate-400 hover:text-white bg-white/[0.04]">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>

        <nav class="mt-6 flex flex-col space-y-1.5">
            <a th:href="@{/dashboard}" class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium transition"
               th:classappend="${active == 'dashboard'} ? 'bg-indigo-600 text-white' : 'text-slate-300 hover:bg-white/[0.04]'">
                Dashboard
            </a>
            <a th:href="@{/mentor}" class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium transition"
               th:classappend="${active == 'mentor'} ? 'bg-indigo-600 text-white' : 'text-slate-300 hover:bg-white/[0.04]'">
                AI Mentor
            </a>
            <a th:href="@{/roadmap}" class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium transition"
               th:classappend="${active == 'roadmap'} ? 'bg-indigo-600 text-white' : 'text-slate-300 hover:bg-white/[0.04]'">
                Roadmap
            </a>
            <a th:href="@{/skill-gap}" class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium transition"
               th:classappend="${active == 'skill-gap'} ? 'bg-indigo-600 text-white' : 'text-slate-300 hover:bg-white/[0.04]'">
                Skill Gap
            </a>
            <a th:href="@{/market/pulse}" class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium transition"
               th:classappend="${active == 'market'} ? 'bg-indigo-600 text-white' : 'text-slate-300 hover:bg-white/[0.04]'">
                Market Pulse
            </a>
            <a th:href="@{/portfolio/manage}" class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium transition"
               th:classappend="${active == 'portfolio'} ? 'bg-indigo-600 text-white' : 'text-slate-300 hover:bg-white/[0.04]'">
                E-Portfolio
            </a>
        </nav>
    </div>

    <div class="pt-6 border-t border-white/[0.06] space-y-2">
        <a th:href="@{/profile}" class="flex items-center gap-2.5 w-full px-3.5 py-2 rounded-xl text-sm font-medium text-slate-300 hover:bg-white/[0.04]">
            <svg class="w-4 h-4 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
            <span>Hồ sơ cá nhân</span>
        </a>
        <form th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="flex items-center gap-2.5 w-full px-3.5 py-2 rounded-xl text-sm font-medium text-rose-400 hover:bg-rose-500/10">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                <span>Đăng xuất</span>
            </button>
        </form>
    </div>
</div>

</body>
</html>

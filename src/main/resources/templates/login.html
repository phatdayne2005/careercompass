<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Đăng nhập · CareerCompass')}"></head>
<body class="min-h-screen bg-[#0a0f1c] font-sans text-slate-200 antialiased flex items-center justify-center px-4">

<main class="w-full max-w-md">
    <div class="rounded-2xl border border-[#232c40] bg-[#141b2d] p-8 shadow-2xl shadow-black/40">

        <!-- Brand -->
        <div th:replace="~{layout/base :: brand}"></div>

        <!-- Tiêu đề -->
        <h1 class="mt-5 text-2xl font-bold text-white">Welcome back</h1>
        <p class="mt-1 text-sm text-slate-400">Sign in to continue your learning roadmap</p>

        <!-- Thông báo (đọc query param do Spring/Controller redirect) -->
        <div th:if="${param.registered}"
             class="mt-5 rounded-lg border border-emerald-500/30 bg-emerald-500/10 px-3 py-2 text-sm text-emerald-300">
            Đăng ký thành công! Mời bạn đăng nhập.
        </div>
        <div th:if="${param.error}"
             class="mt-5 rounded-lg border border-red-500/30 bg-red-500/10 px-3 py-2 text-sm text-red-300">
            Email hoặc mật khẩu không đúng.
        </div>
        <div th:if="${param.logout}"
             class="mt-5 rounded-lg border border-slate-500/30 bg-slate-500/10 px-3 py-2 text-sm text-slate-300">
            Bạn đã đăng xuất.
        </div>

        <!-- Form login: th:action => Thymeleaf tự chèn token CSRF.
             name="username"/"password" là tên mặc định Spring Security tìm. -->
        <form th:action="@{/login}" method="post" class="mt-6 space-y-4">
            <div>
                <label for="username" class="block text-sm font-medium text-slate-300">Email</label>
                <input type="email" id="username" name="username" required
                       placeholder="you@university.edu"
                       class="mt-1.5 w-full rounded-lg border border-[#2a3346] bg-[#0d1322] px-3 py-2.5 text-sm text-slate-100 placeholder-slate-500 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/50">
            </div>

            <div>
                <div class="flex items-center justify-between">
                    <label for="password" class="block text-sm font-medium text-slate-300">Password</label>
                    <a th:href="@{/forgot}" class="text-xs font-medium text-indigo-400 hover:text-indigo-300">Forgot?</a>
                </div>
                <input type="password" id="password" name="password" required
                       placeholder="••••••••••"
                       class="mt-1.5 w-full rounded-lg border border-[#2a3346] bg-[#0d1322] px-3 py-2.5 text-sm text-slate-100 placeholder-slate-500 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/50">
            </div>

            <button type="submit"
                    class="w-full rounded-lg bg-blue-600 py-2.5 text-sm font-semibold text-white transition hover:bg-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/60">
                Sign in
            </button>
        </form>

        <!-- Divider -->
        <div class="my-5 flex items-center gap-3">
            <span class="h-px flex-1 bg-[#232c40]"></span>
            <span class="text-xs text-slate-500">or</span>
            <span class="h-px flex-1 bg-[#232c40]"></span>
        </div>

        <!-- Google OAuth: link GET tới endpoint chuẩn của Spring Security.
             CHỈ hoạt động sau khi cấu hình oauth2Login ở M7. -->
        <a th:href="@{/oauth2/authorization/google}"
           class="flex w-full items-center justify-center gap-2.5 rounded-lg border border-[#2a3346] bg-[#0d1322] py-2.5 text-sm font-medium text-slate-200 transition hover:bg-[#10182a]">
            <svg class="h-4 w-4" viewBox="0 0 48 48" aria-hidden="true">
                <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 4.1 29.6 2 24 2 11.8 2 2 11.8 2 24s9.8 22 22 22 22-9.8 22-22c0-1.5-.2-2.7-.4-3.5z"/>
                <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 16 19 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 4.1 29.6 2 24 2 16.3 2 9.7 6.3 6.3 14.7z"/>
                <path fill="#4CAF50" d="M24 46c5.5 0 10.5-2.1 14.3-5.6l-6.6-5.6C29.5 36.6 26.9 37.5 24 37.5c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.6 41.6 16.2 46 24 46z"/>
                <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.2 5.7l6.6 5.6C41.4 36.9 44 31 44 24c0-1.5-.2-2.7-.4-3.5z"/>
            </svg>
            Continue with Google
        </a>

        <!-- Footer -->
        <p class="mt-6 text-center text-sm text-slate-400">
            New here?
            <a th:href="@{/register}" class="font-medium text-blue-400 hover:text-blue-300">Create an account →</a>
        </p>
    </div>
</main>

</body>
</html>

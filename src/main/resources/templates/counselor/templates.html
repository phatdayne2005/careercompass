<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head(title='Cố Vấn Học Tập · CareerCompass')}"></head>
<body class="bg-[#090d16] text-slate-100 font-sans antialiased min-h-screen flex">
 
    <!-- SIDEBAR -->
    <aside class="w-64 bg-[#0c1220] border-r border-white/[0.06] flex flex-col justify-between shrink-0 p-6">
        <div>
            <!-- Brand Logo -->
            <div class="mb-8 flex justify-center">
                <div th:replace="~{layout/base :: brand}"></div>
            </div>
            
            <!-- Navigation Links -->
            <nav class="space-y-1.5">
                <a href="/counselor/templates" class="flex items-center gap-3 px-4 py-2.5 rounded-xl bg-indigo-600/20 text-indigo-300 font-bold border border-indigo-500/30 transition-all">
                    <svg class="w-5 h-5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"></path></svg>
                    <span>Quản lý Lộ Trình</span>
                </a>
            </nav>
        </div>
        
        <!-- User Section Footer -->
        <div class="border-t border-white/[0.06] pt-4 flex items-center justify-between">
            <div class="flex items-center gap-2.5">
                <div class="w-9 h-9 rounded-xl bg-amber-500/10 border border-amber-500/20 flex items-center justify-center text-amber-400 font-bold text-xs">CS</div>
                <div class="truncate">
                    <p class="text-xs font-bold text-slate-200">Cố Vấn Học Tập</p>
                    <p class="text-[10px] text-slate-500 truncate">counselor@gmail.com</p>
                </div>
            </div>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="p-2 text-slate-400 hover:text-rose-400 hover:bg-rose-500/10 rounded-xl transition cursor-pointer" title="Đăng xuất">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                </button>
            </form>
        </div>
    </aside>
 
    <!-- MAIN CONTENT -->
    <main class="flex-1 p-8 sm:p-10 overflow-y-auto space-y-8">
        <!-- Header -->
        <header class="pb-6 border-b border-white/[0.06]">
            <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-white">Quản Lý Bản Mẫu Lộ Trình</h1>
            <p class="text-xs sm:text-sm text-slate-400 mt-1">Biên soạn, tùy chỉnh và phân cấp các nút kỹ năng trong các chương trình đào tạo mẫu.</p>
        </header>

        <!-- Flash error -->
        <div th:if="${error}" class="flex items-center gap-2 rounded-2xl border border-rose-500/30 bg-rose-500/10 px-4 py-3 text-xs sm:text-sm text-rose-300">
            <svg class="w-4 h-4 shrink-0 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            <span th:text="${error}">Thông báo lỗi</span>
        </div>
 
        <!-- TEMPLATES LIST & CREATE NEW -->
        <section class="grid grid-cols-1 md:grid-cols-2 gap-6">
            
            <!-- Template Cards Loop -->
            <div th:each="tpl : ${templates}" class="rounded-3xl border border-white/[0.08] bg-[#0e1424] p-6 sm:p-7 flex flex-col justify-between hover:border-indigo-500/40 transition duration-200 shadow-sm">
                <div>
                    <div class="flex items-center justify-between mb-4">
                        <span class="px-3 py-1 text-[10px] font-bold uppercase tracking-wider rounded-full bg-indigo-500/10 text-indigo-300 border border-indigo-500/20" th:text="${tpl.careerRole.name}">Career Role</span>
                        <div class="flex items-center gap-1.5">
                            <!-- Edit Button -->
                            <button th:data-id="${tpl.id}"
                                    th:data-name="${tpl.name}"
                                    th:data-description="${tpl.description}"
                                    th:data-role="${tpl.careerRole.name}"
                                    onclick="openEditModal(this)"
                                    class="p-2 rounded-xl text-slate-400 hover:text-indigo-400 hover:bg-indigo-500/10 transition cursor-pointer"
                                    title="Chỉnh sửa thông tin">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                            </button>
                            <!-- Delete Form/Button -->
                            <form th:action="@{'/counselor/templates/' + ${tpl.id} + '/delete'}" method="post" onsubmit="return confirm('Bạn có chắc chắn muốn xóa lộ trình này? Hành động này sẽ xóa toàn bộ các nút kỹ năng bên trong!');" class="inline">
                                <button type="submit" class="p-2 rounded-xl text-slate-400 hover:text-rose-400 hover:bg-rose-500/10 transition cursor-pointer" title="Xóa lộ trình">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                </button>
                            </form>
                        </div>
                    </div>
                    <h3 class="text-lg font-bold text-white mb-2" th:text="${tpl.name}">Template Name</h3>
                    <p class="text-xs sm:text-sm text-slate-400 line-clamp-3 mb-6 leading-relaxed" th:text="${tpl.description}">Mô tả lộ trình...</p>
                </div>
                
                <a th:href="@{'/counselor/templates/' + ${tpl.id} + '/editor'}" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl text-center shadow-lg shadow-indigo-600/20 transition text-xs sm:text-sm">
                    Thiết lập cây kỹ năng →
                </a>
            </div>
 
            <!-- CREATE NEW TEMPLATE CARD -->
            <div class="rounded-3xl border-2 border-dashed border-white/[0.1] bg-[#0e1424]/60 p-6 sm:p-7 flex flex-col justify-between hover:border-indigo-500/40 transition duration-200">
                <form th:action="@{/counselor/templates}" method="post" class="space-y-4 flex-1 flex flex-col justify-between">
                    <div>
                        <div class="flex items-center gap-2 mb-4">
                            <span class="w-2.5 h-2.5 bg-indigo-500 rounded-full animate-pulse"></span>
                            <h3 class="text-xs font-bold text-indigo-400 uppercase tracking-wider">Tạo Lộ Trình Mới</h3>
                        </div>
                        <div class="space-y-3">
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-400 mb-1">Tên lộ trình</label>
                                <input type="text" name="name" placeholder="Ví dụ: Java Backend Developer" required class="w-full bg-[#090d16] border border-white/[0.08] rounded-xl px-3.5 py-2.5 text-xs sm:text-sm text-slate-200 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/30 transition" />
                            </div>
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-400 mb-1">Mô tả lộ trình</label>
                                <textarea name="description" rows="2" placeholder="Mô tả mục tiêu của chương trình đào tạo..." required class="w-full bg-[#090d16] border border-white/[0.08] rounded-xl px-3.5 py-2 text-xs sm:text-sm text-slate-200 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/30 resize-none transition"></textarea>
                            </div>
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-400 mb-1">Vai trò nghề nghiệp mục tiêu</label>
                                <input type="text" name="careerRoleName" placeholder="Ví dụ: Backend Developer" required class="w-full bg-[#090d16] border border-white/[0.08] rounded-xl px-3.5 py-2.5 text-xs sm:text-sm text-slate-200 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/30 transition" />
                            </div>
                        </div>
                    </div>
                    <button type="submit" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl transition shadow-lg shadow-indigo-600/20 text-xs sm:text-sm mt-4 cursor-pointer">
                        Khởi tạo lộ trình
                    </button>
                </form>
            </div>
        </section>
    </main>
 
    <!-- EDIT TEMPLATE MODAL -->
    <div id="edit-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center z-50 transition-opacity">
        <div class="glass-card rounded-3xl border border-white/[0.08] p-6 sm:p-8 w-full max-w-md shadow-2xl relative">
            <button onclick="closeEditModal()" class="absolute top-5 right-5 text-slate-400 hover:text-white transition cursor-pointer">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            <h3 class="text-lg font-bold text-white mb-4">Chỉnh Sửa Lộ Trình</h3>
            <form id="edit-form" method="post" class="space-y-4">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Tên lộ trình</label>
                    <input type="text" id="edit-name" name="name" required class="w-full bg-[#090d16] border border-white/[0.08] rounded-xl px-3.5 py-2.5 text-xs sm:text-sm text-slate-200 focus:border-indigo-500 focus:outline-none" />
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Mô tả lộ trình</label>
                    <textarea id="edit-description" name="description" rows="3" required class="w-full bg-[#090d16] border border-white/[0.08] rounded-xl px-3.5 py-2 text-xs sm:text-sm text-slate-200 focus:border-indigo-500 focus:outline-none resize-none"></textarea>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Vai trò nghề nghiệp mục tiêu</label>
                    <input type="text" id="edit-role" name="careerRoleName" required class="w-full bg-[#090d16] border border-white/[0.08] rounded-xl px-3.5 py-2.5 text-xs sm:text-sm text-slate-200 focus:border-indigo-500 focus:outline-none" />
                </div>
                
                <button type="submit" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl transition text-xs sm:text-sm mt-4 cursor-pointer">
                    Cập nhật lộ trình
                </button>
            </form>
        </div>
    </div>
 
    <script>
        function openEditModal(btn) {
            const id = btn.getAttribute('data-id');
            const name = btn.getAttribute('data-name');
            const description = btn.getAttribute('data-description');
            const roleName = btn.getAttribute('data-role');
 
            document.getElementById('edit-form').action = '/counselor/templates/' + id + '/update';
            document.getElementById('edit-name').value = name;
            document.getElementById('edit-description').value = description;
            document.getElementById('edit-role').value = roleName;
            
            const modal = document.getElementById('edit-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }
        function closeEditModal() {
            const modal = document.getElementById('edit-modal');
            modal.classList.remove('flex');
            modal.classList.add('hidden');
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Đặt lại mật khẩu · CareerCompass')}"></head>
<body class="min-h-screen bg-[#0F172A] font-sans text-slate-200 antialiased flex items-center justify-center px-4">

<main class="w-full max-w-md">
    <div class="rounded-2xl border border-[#232c40] bg-[#141b2d] p-8 shadow-2xl shadow-black/40">

        <!-- Brand -->
        <div class="flex items-center gap-2">
            <span>🔑</span>
            <span class="text-base font-bold text-white tracking-tight">CareerCompass</span>
        </div>

        <h1 class="mt-5 text-2xl font-bold text-white">Đặt lại mật khẩu</h1>

        <!-- TRẠNG THÁI 1: token hợp lệ -> hiện form đổi mật khẩu -->
        <div th:if="${tokenValid}">
            <p class="mt-1 text-sm text-slate-400">Nhập mật khẩu mới cho tài khoản của bạn.</p>

            <!-- Thông báo lỗi validate (mật khẩu ngắn / không khớp) -->
            <div th:if="${error}"
                 class="mt-4 rounded-lg border border-red-500/30 bg-red-500/10 px-3 py-2.5 text-sm text-red-300"
                 th:text="${error}">Lỗi.</div>

            <form th:action="@{/reset-password}" method="post" class="mt-6 space-y-4">
                <!-- token đi kèm để POST biết đang đổi cho ai -->
                <input type="hidden" name="token" th:value="${token}">

                <div>
                    <label for="newPassword" class="block text-sm font-medium text-slate-300">Mật khẩu mới</label>
                    <input type="password" id="newPassword" name="newPassword" required minlength="6"
                           placeholder="Tối thiểu 6 ký tự"
                           class="mt-1.5 w-full rounded-lg border border-[#2a3346] bg-[#0d1322] px-3 py-2.5 text-sm text-slate-100 placeholder-slate-500 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/50">
                </div>

                <div>
                    <label for="confirmPassword" class="block text-sm font-medium text-slate-300">Xác nhận mật khẩu</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required minlength="6"
                           placeholder="Nhập lại mật khẩu mới"
                           class="mt-1.5 w-full rounded-lg border border-[#2a3346] bg-[#0d1322] px-3 py-2.5 text-sm text-slate-100 placeholder-slate-500 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/50">
                </div>

                <button type="submit"
                        class="w-full rounded-lg bg-blue-600 py-2.5 text-sm font-semibold text-white transition hover:bg-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/60">
                    Đổi mật khẩu
                </button>
            </form>
        </div>

        <!-- TRẠNG THÁI 2: token không hợp lệ / hết hạn -->
        <div th:unless="${tokenValid}">
            <div class="mt-4 rounded-lg border border-red-500/30 bg-red-500/10 px-3 py-3 text-sm text-red-300">
                ✗ <span th:text="${error} ?: 'Link đặt lại không hợp lệ hoặc đã hết hạn.'">Link không hợp lệ.</span>
            </div>
            <a th:href="@{/forgot}"
               class="mt-6 block w-full rounded-lg bg-blue-600 py-2.5 text-center text-sm font-semibold text-white transition hover:bg-blue-500">
                Yêu cầu link mới
            </a>
        </div>

        <p class="mt-6 text-center text-sm">
            <a th:href="@{/login}" class="font-medium text-blue-400 hover:text-blue-300">← Quay lại đăng nhập</a>
        </p>
    </div>
</main>

</body>
</html>

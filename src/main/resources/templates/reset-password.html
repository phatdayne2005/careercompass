<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Đặt lại mật khẩu · CareerCompass')}"></head>
<body class="min-h-screen bg-[#090d16] font-sans text-slate-200 antialiased flex items-center justify-center p-4 sm:p-6 relative overflow-x-hidden">

<!-- Decorative Background Glow -->
<div class="fixed -top-40 -right-40 w-96 h-96 bg-indigo-600/15 rounded-full blur-3xl pointer-events-none"></div>
<div class="fixed -bottom-40 -left-40 w-96 h-96 bg-purple-600/15 rounded-full blur-3xl pointer-events-none"></div>

<main class="w-full max-w-md relative z-10">
    <div class="glass-card rounded-3xl p-8 sm:p-10 border border-white/[0.08] shadow-2xl shadow-black/60">

        <!-- Brand Header -->
        <div class="flex justify-center mb-6">
            <div th:replace="~{layout/base :: brand}"></div>
        </div>

        <div class="text-center mb-7">
            <h1 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">Đặt lại mật khẩu</h1>
            <p class="mt-1.5 text-sm text-slate-400">Tạo mật khẩu mới an toàn cho tài khoản của bạn</p>
        </div>

        <!-- Trạng thái 1: Token hợp lệ -->
        <div th:if="${tokenValid}">
            <!-- Error message if any -->
            <div th:if="${error}"
                 class="mb-5 rounded-2xl border border-rose-500/30 bg-rose-500/10 px-4 py-3 text-xs sm:text-sm text-rose-300 flex items-center gap-2">
                <svg class="w-4 h-4 shrink-0 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                <span th:text="${error}">Lỗi.</span>
            </div>

            <form th:action="@{/reset-password}" method="post" class="space-y-4">
                <input type="hidden" name="token" th:value="${token}">

                <div>
                    <label for="newPassword" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Mật khẩu mới</label>
                    <input type="password" id="newPassword" name="newPassword" required minlength="6"
                           placeholder="Tối thiểu 6 ký tự"
                           class="w-full rounded-xl border border-white/[0.08] bg-[#0c1220] px-4 py-3 text-sm text-slate-100 placeholder-slate-500 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/30 transition">
                </div>

                <div>
                    <label for="confirmPassword" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Xác nhận mật khẩu mới</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required minlength="6"
                           placeholder="Nhập lại mật khẩu mới"
                           class="w-full rounded-xl border border-white/[0.08] bg-[#0c1220] px-4 py-3 text-sm text-slate-100 placeholder-slate-500 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/30 transition">
                </div>

                <button type="submit"
                        class="w-full mt-2 rounded-xl bg-gradient-to-r from-indigo-600 via-indigo-500 to-purple-600 py-3 text-sm font-bold text-white shadow-lg shadow-indigo-600/25 transition-all duration-200 hover:opacity-95 hover:shadow-indigo-600/40 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 cursor-pointer">
                    Cập nhật mật khẩu
                </button>
            </form>
        </div>

        <!-- Trạng thái 2: Token hết hạn hoặc không hợp lệ -->
        <div th:unless="${tokenValid}">
            <div class="mb-5 rounded-2xl border border-rose-500/30 bg-rose-500/10 px-4 py-3 text-xs sm:text-sm text-rose-300 flex items-center gap-2">
                <svg class="w-4 h-4 shrink-0 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                <span th:text="${error} ?: 'Liên kết đặt lại mật khẩu không hợp lệ hoặc đã hết hạn.'">Link không hợp lệ.</span>
            </div>
            <a th:href="@{/forgot}"
               class="block w-full text-center rounded-xl bg-indigo-600 hover:bg-indigo-500 py-3 text-sm font-bold text-white shadow-lg shadow-indigo-600/25 transition">
                Yêu cầu liên kết mới
            </a>
        </div>

        <p class="mt-7 text-center text-xs sm:text-sm text-slate-400">
            <a th:href="@{/login}" class="font-semibold text-indigo-400 hover:text-indigo-300 transition">← Quay lại trang đăng nhập</a>
        </p>
    </div>
</main>

</body>
</html>

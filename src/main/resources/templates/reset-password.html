<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Đặt lại mật khẩu · CareerCompass')}"></head>
<body class="min-h-screen bg-[#030712] font-sans text-slate-200 antialiased flex items-center justify-center p-4 sm:p-6 relative overflow-x-hidden cyber-grid">

<!-- Background Aurora Glow Orbs -->
<div class="fixed top-1/4 right-1/4 w-[450px] h-[450px] aurora-orb-cyan blur-[130px] pointer-events-none"></div>
<div class="fixed bottom-1/4 left-1/4 w-[450px] h-[450px] aurora-orb-violet blur-[130px] pointer-events-none"></div>

<main class="w-full max-w-md relative z-10">
    <div class="cyber-card rounded-3xl p-8 sm:p-10 border border-white/[0.1] shadow-2xl relative overflow-hidden">

        <!-- Radiant Top Accent Line -->
        <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-cyan-400 via-violet-500 to-fuchsia-500"></div>

        <!-- Brand Header -->
        <div class="flex justify-center mb-6">
            <div th:replace="~{layout/base :: brand}"></div>
        </div>

        <div class="text-center mb-7">
            <h1 class="text-2xl sm:text-3xl font-black text-white tracking-tight">Đặt lại mật khẩu</h1>
            <p class="mt-1.5 text-xs sm:text-sm text-slate-400">Tạo mật khẩu mới an toàn cho tài khoản của bạn</p>
        </div>

        <!-- Trạng thái 1: Token hợp lệ -->
        <div th:if="${tokenValid}">
            <div th:if="${error}"
                 class="mb-5 rounded-2xl border border-rose-500/30 bg-rose-500/10 px-4 py-3 text-xs sm:text-sm text-rose-300 flex items-center gap-2">
                <svg class="w-4 h-4 shrink-0 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                <span th:text="${error}">Lỗi.</span>
            </div>

            <form th:action="@{/reset-password}" method="post" class="space-y-4">
                <input type="hidden" name="token" th:value="${token}">

                <div>
                    <label for="newPassword" class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1.5">Mật khẩu mới</label>
                    <input type="password" id="newPassword" name="newPassword" required minlength="6"
                           placeholder="Tối thiểu 6 ký tự"
                           class="w-full rounded-2xl border border-white/[0.08] bg-[#070b16] px-4 py-3 text-xs sm:text-sm text-slate-100 placeholder-slate-600 focus:border-cyan-400 focus:outline-none focus:ring-2 focus:ring-cyan-400/20 transition">
                </div>

                <div>
                    <label for="confirmPassword" class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1.5">Xác nhận mật khẩu mới</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required minlength="6"
                           placeholder="Nhập lại mật khẩu mới"
                           class="w-full rounded-2xl border border-white/[0.08] bg-[#070b16] px-4 py-3 text-xs sm:text-sm text-slate-100 placeholder-slate-600 focus:border-cyan-400 focus:outline-none focus:ring-2 focus:ring-cyan-400/20 transition">
                </div>

                <button type="submit"
                        class="w-full mt-3 rounded-2xl bg-gradient-to-r from-cyan-500 via-indigo-500 to-violet-600 py-3 text-xs sm:text-sm font-extrabold text-white shadow-lg shadow-cyan-500/25 transition-all duration-200 hover:opacity-95 hover:shadow-cyan-500/40 cursor-pointer">
                    Cập nhật mật khẩu
                </button>
            </form>
        </div>

        <!-- Trạng thái 2: Token không hợp lệ -->
        <div th:unless="${tokenValid}">
            <div class="mb-5 rounded-2xl border border-rose-500/30 bg-rose-500/10 px-4 py-3 text-xs sm:text-sm text-rose-300 flex items-center gap-2">
                <svg class="w-4 h-4 shrink-0 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                <span th:text="${error} ?: 'Liên kết đặt lại mật khẩu không hợp lệ hoặc đã hết hạn.'">Link không hợp lệ.</span>
            </div>
            <a th:href="@{/forgot}"
               class="block w-full text-center rounded-2xl bg-cyan-600 hover:bg-cyan-500 py-3 text-xs sm:text-sm font-extrabold text-black shadow-lg shadow-cyan-500/25 transition">
                Yêu cầu liên kết mới
            </a>
        </div>

        <p class="mt-7 text-center text-xs text-slate-400">
            <a th:href="@{/login}" class="font-bold text-cyan-400 hover:text-cyan-300 transition">← Quay lại trang đăng nhập</a>
        </p>
    </div>
</main>

</body>
</html>
